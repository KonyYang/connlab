[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "connlab"
version = "0.1.0"
description = "ConnLab MVP backend scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "olefile>=0.47,<1.0",
  "openpyxl>=3.1,<4.0",
  "pdfplumber>=0.11,<1.0",
  "pydantic>=2.7,<3.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "pywin32>=306,<400; sys_platform == 'win32'",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "reportlab>=4.0,<5.0",
]
desktop = [
  "pywebview>=5.0,<6.0",
]
release = [
  "pyinstaller>=6.0,<7.0",
  "pywebview>=5.0,<6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]
